// ============================================================================
// MixTeamRating —— 按最近 N 场平均 RatingPro 分队（!mix rating）
//
// 需要 mix_team + l4d2_round_ratingpro 同时在场，缺任何一个都不会注册 !mix rating。
// 取样场数由 l4d2_round_ratingpro 的 RATINGPRO_MAX_RECENT_RATINGS 决定（默认 5 场）。
// 分队规则：人数对半（不超过 survivor_limit），两边平均 RatingPro 总和尽量接近。
// 本文件默认全部注释，插件内置默认值就写在下面，需要改再取消注释。
// ============================================================================

// 缺少最近 RatingPro 数据时是否取消本次 mix
// 1 = 取消（推荐；新号 / 还没结算过对局的人会挡住整个 mix）
// 0 = 用 sm_mt_rating_default_rating 给没数据的玩家补一个占位分
// -
// 默认: "1"
// sm_mt_rating_require_data "1"

// sm_mt_rating_require_data=0 时，没有 RatingPro 数据的玩家使用的占位平均分（0-10）
// 5.0 相当于「不偏不倚」，既不会被当成大腿，也不会被当成短板。
// -
// 默认: "5.0"
// sm_mt_rating_default_rating "5.0"
