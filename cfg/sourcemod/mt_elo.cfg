// ============================================================================
// MixTeamElo —— 按 ELO 分队（!mix elo）
//
// 需要 mix_team + l4d2_round_ratingpro 同时在场，缺任何一个都不会注册 !mix elo。
// 分队规则：人数对半（不超过 survivor_limit），两边 ELO 总和尽量接近。
// 本文件默认全部注释，插件内置默认值就写在下面，需要改再取消注释。
// ============================================================================

// 缺少 ELO 缓存时是否取消本次 mix
// 1 = 取消（推荐，避免用默认值算出一边倒的分队）
// 0 = 用 sm_mt_elo_default_elo 给没数据的玩家补一个占位分
// -
// 默认: "1"
// sm_mt_elo_require_data "1"

// sm_mt_elo_require_data=0 时，没有 ELO 数据的玩家使用的占位 ELO
// -
// 默认: "1500.0"
// sm_mt_elo_default_elo "1500.0"
