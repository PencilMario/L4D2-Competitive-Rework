// ============================================================================
// L4D2 RatingPro ELO 提示 —— 进服播报与 !elo 查询
// SourceMod 启动时会自动执行本文件，取消注释即可生效。
//
// 依赖 l4d2_round_ratingpro.smx：本插件只读它的本地缓存，不再单独请求后端。
// ============================================================================

// ---------------------------- 进服提示 ----------------------------
// 玩家进服后提示其 ELO、排名、最近一次结算变化与最近 5 场平均 Rating
// 关掉后 !elo 仍然可用，只是不再自动播报。
// -
// 默认: "1"
// 最小: "0.000000"  最大: "1.000000"
sm_ratingpro_elo_notify "1"

// 进服提示的延迟秒数（等连接期的其他提示刷完再发）
// ELO 数据本身是异步请求的，这里只控制数据就绪之后等多久再打印。
// -
// 默认: "3.0"
// 最小: "0.000000"  最大: "30.000000"
sm_ratingpro_elo_delay "3.0"

// 进服提示里附带全服 ELO 排名
// -
// 默认: "1"
// 最小: "0.000000"  最大: "1.000000"
sm_ratingpro_elo_show_rank "1"

// 进服提示里附带最近一次结算的 ELO 变化
// 显示为「上次结算 +12.3（1487.7 → 1500.0）」。
// -
// 默认: "1"
// 最小: "0.000000"  最大: "1.000000"
sm_ratingpro_elo_show_delta "1"

// 进服提示里附带最近 5 场平均 Rating
// 显示为「近 5 场平均 6.42」；有效结算不足时按实际场数显示。
// -
// 默认: "1"
// 最小: "0.000000"  最大: "1.000000"
sm_ratingpro_elo_show_recent "1"

// ---------------------------- 结算提示 ----------------------------
// 对局结算上传后提示 ELO 变化
// 0 = 关闭，1 = 只提示本人，2 = 提示全员（一次上传会给每位参战者各发一条）。
// -
// 默认: "1"
// 最小: "0.000000"  最大: "2.000000"
sm_ratingpro_elo_update "1"

// 进服时 ELO 数据请求失败的重试次数
// 每次重试间隔 8 秒；重试用尽后会提示玩家可稍后用 !elo 再查。
// -
// 默认: "2"
// 最小: "0.000000"  最大: "5.000000"
sm_ratingpro_elo_retry "2"
