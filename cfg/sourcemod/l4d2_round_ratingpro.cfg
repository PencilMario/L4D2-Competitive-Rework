// ============================================================================
// L4D2 Round RatingPro —— 后端接入配置
// SourceMod 启动时会自动执行本文件，取消注释即可生效。
//
// 注意：API Key 属于敏感信息，请只写在本机的 cfg 里，不要提交回仓库。
// ============================================================================

// ---------------------------- 评分播报 ----------------------------
// 回合结束时播报最佳 RatingPro 表现
// -
// 默认: "1"
sm_round_ratingpro_enabled "1"

// 回合结束后延迟公布最佳玩家的秒数
// -
// 默认: "3.0"
sm_round_ratingpro_delay "3.0"

// 公布最佳表现所需的最低加权原始分阈值
// -
// 默认: "1.0"
sm_round_ratingpro_min_raw "1.0"

// ---------------------------- 后端接入 ----------------------------
// 启用 RatingPro Hub 后端接入（ELO 缓存 + 对局上传）
// 关闭后不再发起任何网络请求，游戏内 !rating 行为不受影响。
// -
// 默认: "1"
sm_ratingpro_api_enabled "1"

// RatingPro Hub 后端地址，末尾不要带斜杠
// -
// 默认: "https://l4d2rating.0721play.icu"
sm_ratingpro_api_base "https://l4d2rating.0721play.icu"

// 上传对局数据的 API Key（后端 data/ingest-key.txt）
// 留空时只读不写：仍会缓存 ELO 与最近 5 场平均分，但不会上传对局。
// -
// 默认: ""
// sm_ratingpro_api_key ""

// 服务器标识，后端用它区分多台服务器并做幂等去重
// 留空时取 hostname。
// -
// 默认: ""
// sm_ratingpro_server_key "cn-l4d2-01"

// 同一章节累计结算多少张图后上传一次对局数据
// 官方 4 图战役保持 4；3 图战役（如短暂关卡）可改成 3。
// 每攒满这个数量就上传一次，上传后计数器立即归零重新累计 —— 在同一个战役里连打
// 超过这个张数会分多次上传；上一发还没结清时不会重复攒。
// 中途换图 / 跳章 / 比分被重置同样只把计数器归零：这段不完整对局不上传，
// 玩家评分窗口（!rating 的历史口径）不受影响。
// 断章判定只看「连续对局」：双方战役比分单调不减即视为同一段，地图名（战役前缀、
// 章节号）完全不参与 —— 仓库里有插件能把随机地图拼成章节序列，前缀变化与跳章都
// 可能是同一段连续对局。
// -
// 默认: "4"
// 最小: "1.000000"  最大: "4.000000"
sm_ratingpro_upload_maps "4"

// 参与人数达到该值（含）才上传对局数据
// 用来挡住测试局、人没凑齐的半局污染后端。判定用的是「触发上传的那张图」的参与人数
// （本图触发过统计事件的去重 SteamID 数），人数不足时这段数据直接丢弃、计数器归零，
// 而不是留到下一局再传 —— players[] 只取自触发的那张图，攒着不消费会把人数错配出去。
// 0 表示不限制。
// -
// 默认: "8"
// 最小: "0.000000"  最大: "64.000000"
sm_ratingpro_min_players "8"

// 玩家认证完成时自动请求并缓存 ELO 与最近 5 场平均 RatingPro
// -
// 默认: "1"
sm_ratingpro_auto_refresh "1"

// 后端排查日志级别（独立文件 addons/sourcemod/logs/l4d2_ratingpro_api.log）
// 0 = 关闭；1 = 只记请求失败、上传结果与会话头；2 = 另外记录每次请求的 URL、
// 响应体与上传载荷（含成功请求，量大）。
// 默认 2：先把证据记全。查「ELO 请求失败」时让玩家重进一次，再看日志里该玩家对应
// 的那几行：传输失败 = 服务器出站网络问题；HTTP 4xx = 后端拒绝（路径/鉴权/参数）；
// 解析失败 = 后端返回结构变了。改完即时生效，不用重载插件。
// 排查结束、确认稳定后可降到 1（只记失败）或 0 关掉，避免正常请求持续占磁盘。
// -
// 默认: "2"
// 最小: "0.000000"  最大: "2.000000"
sm_ratingpro_api_log "2"

// 用「双方战役比分不减」判定对局是否连续（依赖 left4dhooks）
// 这是唯一的断章信号：关掉后不再检测中断，上传计数只在攒满上传时归零。
// -
// 默认: "1"
sm_ratingpro_score_guard "1"
